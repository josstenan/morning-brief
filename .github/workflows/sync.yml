name: Sync briefs from OneDrive

on:
  schedule:
    # 5:30am and 7:00am Melbourne (AEDT, UTC+11). Adjust in April when daylight saving ends.
    - cron: "30 18 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Pull briefs from OneDrive
        env:
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
        run: python tools/sync_from_onedrive.py
      - name: Commit changes
        run: |
          git config user.name "Morning Brief bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefs downloads
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sync briefs $(date -u +%Y-%m-%d)"
          git push
